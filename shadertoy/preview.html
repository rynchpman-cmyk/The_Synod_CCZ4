<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BNS Causal Repair Shader Preview</title>
  <style>
    html, body, canvas { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #010208; }
    canvas { display: block; }
    #status { position: fixed; left: 12px; top: 10px; color: #b9dfff; font: 12px/1.4 monospace;
      white-space: pre-wrap; max-width: calc(100% - 24px); pointer-events: none; text-shadow: 0 1px 3px #000; }
  </style>
</head>
<body data-shader-status="loading">
<canvas id="view"></canvas>
<pre id="status">Compiling shader...</pre>
<script>
(() => {
  const canvas = document.getElementById('view');
  const status = document.getElementById('status');
  const gl = canvas.getContext('webgl2', { antialias: false, alpha: false });
  if (!gl) {
    status.textContent = 'WebGL 2 is unavailable.';
    document.body.dataset.shaderStatus = 'webgl-unavailable';
    return;
  }
  const vertexSource = `#version 300 es
  in vec2 position;
  void main() { gl_Position = vec4(position, 0.0, 1.0); }`;
  const header = `#version 300 es
  precision highp float;
  uniform vec3 iResolution;
  uniform float iTime;
  uniform vec4 iMouse;
  out vec4 previewColor;
  #define texture2D texture
  `;
  const footer = `
  void main() { mainImage(previewColor, gl_FragCoord.xy); }
  `;

  function compile(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(shader));
    }
    return shader;
  }

  const query = new URLSearchParams(location.search);
  const requestedShader = query.get('shader') || 'BNS_CAUSAL_REPAIR.glsl';
  const shaderName = /^[A-Za-z0-9_.-]+$/.test(requestedShader)
    ? requestedShader
    : 'BNS_CAUSAL_REPAIR.glsl';
  fetch(shaderName)
    .then(response => {
      if (!response.ok) throw new Error(`shader fetch failed: ${response.status}`);
      return response.text();
    })
    .then(source => {
      const program = gl.createProgram();
      gl.attachShader(program, compile(gl.VERTEX_SHADER, vertexSource));
      gl.attachShader(program, compile(gl.FRAGMENT_SHADER, header + source + footer));
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        throw new Error(gl.getProgramInfoLog(program));
      }
      gl.useProgram(program);
      const buffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
      const position = gl.getAttribLocation(program, 'position');
      gl.enableVertexAttribArray(position);
      gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
      const resolution = gl.getUniformLocation(program, 'iResolution');
      const time = gl.getUniformLocation(program, 'iTime');
      const mouseUniform = gl.getUniformLocation(program, 'iMouse');
      const mouse = [0, 0, 0, 0];
      canvas.addEventListener('pointerdown', event => {
        mouse[2] = event.offsetX;
        mouse[3] = canvas.clientHeight - event.offsetY;
      });
      canvas.addEventListener('pointermove', event => {
        if (event.buttons) {
          mouse[0] = event.offsetX;
          mouse[1] = canvas.clientHeight - event.offsetY;
        }
      });
      canvas.addEventListener('pointerup', () => { mouse[2] = 0; mouse[3] = 0; });
      const requestedTime = Number(query.get('time'));
      const hasRequestedTime = Number.isFinite(requestedTime) && requestedTime >= 0;
      const start = performance.now() - 9500.0;
      function frame(now) {
        const scale = Math.min(devicePixelRatio || 1, 1.5);
        const width = Math.max(1, Math.floor(canvas.clientWidth * scale));
        const height = Math.max(1, Math.floor(canvas.clientHeight * scale));
        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
          gl.viewport(0, 0, width, height);
        }
        gl.uniform3f(resolution, width, height, 1);
        gl.uniform1f(time, hasRequestedTime ? requestedTime : (now - start) * 0.001);
        gl.uniform4f(mouseUniform, mouse[0], mouse[1], mouse[2], mouse[3]);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        requestAnimationFrame(frame);
      }
      status.textContent = '';
      document.body.dataset.shaderStatus = 'compiled';
      requestAnimationFrame(frame);
    })
    .catch(error => {
      status.textContent = `Shader compile failed:\n${error.message}`;
      document.body.dataset.shaderStatus = 'compile-failed';
    });
})();
</script>
</body>
</html>
